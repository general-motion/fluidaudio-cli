name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".swift-format"
      - ".swiftlint.yml"
      - "Makefile"
      - "Package.resolved"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".swift-format"
      - ".swiftlint.yml"
      - "Makefile"
      - "Package.resolved"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run checks
        run: make check

      - name: Run CLI smoke tests
        run: |
          .build/debug/fluidaudio --help
          .build/debug/fluidaudio --version
