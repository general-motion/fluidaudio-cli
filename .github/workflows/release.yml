name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify release target
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Verify tag matches CLI version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cli_version="$(
            sed -n 's/.*public static let cliVersion = "\(.*\)".*/\1/p' \
              Sources/FluidAudioCommand/FluidAudioCommand.swift
          )"

          if [[ "${tag_version}" != "${cli_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CLI version ${cli_version}." >&2
            exit 1
          fi

      - name: Run checks
        run: make check

      - name: Run CLI smoke tests
        run: |
          .build/debug/fluidaudio --help
          .build/debug/fluidaudio --version

      - name: Build release binary
        run: swift build -c release --product fluidaudio

      - name: Package archive
        run: |
          archive="fluidaudio-aarch64-apple-darwin.tar.gz"
          mkdir -p dist/package
          cp .build/release/fluidaudio dist/package/fluidaudio
          tar -czf "dist/${archive}" -C dist/package fluidaudio
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="fluidaudio-aarch64-apple-darwin.tar.gz"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prebuilt macOS Apple Silicon binary for ${GITHUB_REF_NAME}."
